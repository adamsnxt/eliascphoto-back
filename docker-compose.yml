name: eliascphoto

services:
  postgres:
    image: postgres:17-alpine
    container_name: eliascphoto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eliascphoto
      POSTGRES_USER: post
      POSTGRES_PASSWORD: post
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U post -d eliascphoto"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: eliascphoto-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"

volumes:
  postgres_data:
