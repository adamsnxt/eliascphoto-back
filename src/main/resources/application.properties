spring.application.name=eliascphoto
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eliascphoto}
spring.datasource.username=${DB_USERNAME:post}
spring.datasource.password=${DB_PASSWORD:post}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:eliascphoto}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P7D}
app.security.registration.allowed-ip=${REGISTER_ALLOWED_IP:}
app.appointments.minimum-notice=${APPOINTMENTS_MINIMUM_NOTICE:PT1H}
app.appointments.time-zone=${APPOINTMENTS_TIME_ZONE:America/Argentina/Buenos_Aires}
